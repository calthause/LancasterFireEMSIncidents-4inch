[platformio]
default_envs = esp32dev-4inch

[env:esp32dev-4inch]
; ESP32 Dev Board with Freenove 4.0" Display (ST7796 320x480, resistive touch)
platform = espressif32@5.4.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    tzapu/WiFiManager @ ^2.0.17

; ST7796 panel dimensions (portrait native)
build_flags =
    -DBOARD_FREENOVE_4INCH
    -DCYD_PANEL_W=320
    -DCYD_PANEL_H=480
